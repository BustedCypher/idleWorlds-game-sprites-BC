name: Publish verified icon split

on:
  push:
    branches: [codex/icon-atlas-split-publish]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Build and verify icon chunks
        run: |
          python tools/build_icon_chunks.py
          python tools/integrate_icon_loader.py
          python tools/sync_gear_manifest_csv.py
          python tools/verify_icon_migration.py
          node --test tests/icon-sprites-v2.test.js
          node tools/check-inline-scripts.js index.html
      - name: Publish verified tree to main
        run: |
          rm .github/workflows/publish-icon-split.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: publish demand-loaded icon chunks"
          git push origin HEAD:main
